site_name: PyTorch 입문 튜토리얼
site_description: 파이썬은 익숙하지만 머신러닝은 처음인 학생을 위한 PyTorch 튜토리얼
site_url: https://alsrjs0725.github.io/EntryToPytorchForStudent/
repo_url: https://github.com/alsrjs0725/EntryToPytorchForStudent
repo_name: EntryToPytorchForStudent
edit_uri: edit/main/docs/

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드

plugins:
  - search:
      lang: [ko, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 홈: index.md
  - 튜토리얼:
      - chapters/index.md
      - 1. 토크나이저: chapters/01-tokenizer.md
      - 2. 레이어의 개념: chapters/02-layers.md
      - 3. 트랜스포머 레이어: chapters/03-transformer.md
      - 4. 띄어쓰기 모델 만들기: chapters/04-spacing-model.md
      - 5. 기초 LLM 구현: chapters/05-llm.md
  - 작성 가이드: writing-guide.md
